plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'com.civquest'
version = project.findProperty('modVersion') ?: '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

def integrationServerDir = layout.buildDirectory.dir('integration-server')

def prepareIntegrationServer = tasks.register('prepareIntegrationServer') {
    description = 'Prepares isolated sandbox directory, eula.txt, and server.properties for headless integration server'
    group = 'run'

    outputs.file(integrationServerDir.map { it.file('eula.txt') })
    outputs.file(integrationServerDir.map { it.file('server.properties') })

    doLast {
        def targetDir = integrationServerDir.get().asFile
        if (!targetDir.exists()) {
            targetDir.mkdirs()
        }

        new File(targetDir, 'eula.txt').text = "eula=true\n"

        new File(targetDir, 'server.properties').text = """level-type=minecraft:flat
pause-when-empty-seconds=-1
max-tick-time=-1
online-mode=false
sync-chunk-writes=false
server-port=0
"""
    }
}

tasks.matching { it.name == 'runIntegrationServer' }.configureEach {
    dependsOn(prepareIntegrationServer)
    standardInput = System.in
}

tasks.matching { it.name == 'prepareIntegrationServerRun' }.configureEach {
    dependsOn(prepareIntegrationServer)
}

neoForge {
    version = '21.1.265'

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'civquest'
            jvmArguments.addAll('-Xms1024m', '-Xmx2048m')
            ['civquest.driver.enabled', 'civquest.driver.target', 'civquest.driver.screenshots.dir', 'civquest.driver.scenario', 'civquest.driver.actions', 'civquest.driver.exitOnComplete'].each { prop ->
                if (System.getProperty(prop) != null) {
                    systemProperty prop, System.getProperty(prop)
                }
            }
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', 'civquest'
            systemProperty 'java.awt.headless', 'true'
            jvmArguments.addAll('-Xms1024m', '-Xmx2048m')
        }
        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'civquest'
            programArgument '--nogui'
            jvmArguments.addAll('-Xms1024m', '-Xmx2048m')
        }
        integrationServer {
            server()
            programArgument '--nogui'
            systemProperty 'civquest.grpc.bind', '127.0.0.1:0'
            systemProperty 'civquest.discovery.path', 'civquest-server-meta.json'
            systemProperty 'java.awt.headless', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'civquest'
            jvmArguments.addAll('-Xms1024m', '-Xmx2048m')
            gameDirectory = project.layout.buildDirectory.dir('integration-server')
        }
    }

    mods {
        civquest {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    additionalRuntimeClasspath.extendsFrom implementation
}

dependencies {
    implementation 'com.google.guava:guava:32.1.2-jre'
    implementation 'com.google.guava:failureaccess:1.0.1'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'com.google.protobuf:protobuf-java:4.28.3'
    jarJar 'com.google.protobuf:protobuf-java:4.28.3'
    implementation('io.grpc:grpc-stub:1.68.1') {
        exclude group: 'com.google.guava'
        exclude group: 'com.google.code.gson'
    }
    jarJar('io.grpc:grpc-stub:1.68.1') {
        exclude group: 'com.google.guava'
        exclude group: 'com.google.code.gson'
    }
    implementation('io.grpc:grpc-protobuf:1.68.1') {
        exclude group: 'com.google.guava'
        exclude group: 'com.google.code.gson'
    }
    jarJar('io.grpc:grpc-protobuf:1.68.1') {
        exclude group: 'com.google.guava'
        exclude group: 'com.google.code.gson'
    }
    implementation('io.grpc:grpc-netty-shaded:1.68.1') {
        exclude group: 'com.google.guava'
        exclude group: 'com.google.code.gson'
    }
    jarJar('io.grpc:grpc-netty-shaded:1.68.1') {
        exclude group: 'com.google.guava'
        exclude group: 'com.google.code.gson'
    }
    implementation('io.grpc:grpc-services:1.68.1') {
        exclude group: 'com.google.guava'
        exclude group: 'com.google.code.gson'
    }
    jarJar('io.grpc:grpc-services:1.68.1') {
        exclude group: 'com.google.guava'
        exclude group: 'com.google.code.gson'
    }
    jarJar('io.grpc:grpc-api:1.68.1') {
        exclude group: 'com.google.guava'
    }
    jarJar('io.grpc:grpc-core:1.68.1') {
        exclude group: 'com.google.guava'
    }
    jarJar('io.grpc:grpc-context:1.68.1')
    jarJar('io.grpc:grpc-util:1.68.1') {
        exclude group: 'com.google.guava'
    }
    jarJar('io.grpc:grpc-protobuf-lite:1.68.1') {
        exclude group: 'com.google.guava'
    }
    jarJar('com.google.api.grpc:proto-google-common-protos:2.41.0') {
        exclude group: 'com.google.guava'
    }
    jarJar('io.perfmark:perfmark-api:0.27.0')
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2' // for javax.annotation.Generated

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.9'
}

tasks.named('compileTestJava').configure {
    classpath += sourceSets.main.compileClasspath
}

test {
    useJUnitPlatform()
    classpath += sourceSets.main.compileClasspath
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'src/generated/main/java']
        }
    }
}

def verifyJarJarPackaging = tasks.register('verifyJarJarPackaging') {
    description = 'Verifies that the built mod JAR contains META-INF/jarjar/metadata.json and all required gRPC and protobuf libraries'
    group = 'verification'
    dependsOn tasks.named('jar')

    doLast {
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        if (!jarFile.exists()) {
            throw new GradleException("JAR file not found: ${jarFile}")
        }

        def expectedEntries = [
            'META-INF/jarjar/metadata.json',
            'META-INF/jarjar/protobuf-java-',
            'META-INF/jarjar/grpc-api-',
            'META-INF/jarjar/grpc-core-',
            'META-INF/jarjar/grpc-netty-shaded-',
            'META-INF/jarjar/grpc-protobuf-',
            'META-INF/jarjar/grpc-stub-',
            'META-INF/jarjar/grpc-services-'
        ]

        def foundEntries = []
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entry ->
                foundEntries << entry.name
            }
        }

        def missing = []
        for (pattern in expectedEntries) {
            if (!foundEntries.any { it.contains(pattern) }) {
                missing << pattern
            }
        }

        if (!missing.isEmpty()) {
            throw new GradleException("Jar-in-Jar packaging verification failed! The following required entries are missing from ${jarFile.name}: ${missing}")
        }
        logger.lifecycle("✓ Jar-in-Jar packaging verified successfully in ${jarFile.name} (${foundEntries.findAll { it.startsWith('META-INF/jarjar/') }.size()} jarjar entries)")
    }
}

tasks.named('check').configure {
    dependsOn(verifyJarJarPackaging)
}
