syntax = "proto3";

package civquest.v1;

option go_package = "github.com/btposey/civquest/orchestrator-go/internal/proto/v1;civquestv1";
option java_package = "com.civquest.mod.grpc.v1";
option java_multiple_files = true;

// CivQuestBridgeService defines the gRPC bridge between the Minecraft NeoForge mod and external orchestrators.
service CivQuestBridgeService {
  // Primary per-agent bidirectional control and telemetry stream
  rpc ConnectAgent(stream IntentBatch) returns (stream TelemetryFrame);

  // Administrative RPCs called by cq supervisor
  rpc SpawnAgentEntity(SpawnAgentRequest) returns (SpawnAgentResponse);
  rpc DespawnAgentEntity(DespawnAgentRequest) returns (DespawnAgentResponse);
  rpc ExportRecipeGraph(ExportRecipeRequest) returns (ExportRecipeResponse);
}

// ==================== COMMON PRIMITIVES ====================

message Vec3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message BlockPosProto {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
}

message BoundingBoxProto {
  BlockPosProto min = 1;
  BlockPosProto max = 2;
}

message ItemStackProto {
  string item_id = 1;           // e.g., "minecraft:iron_ingot", "farmersdelight:tomato_soup"
  int32 count = 2;
  int32 slot = 3;
  int32 durability = 4;
  int32 max_durability = 5;
  string custom_name = 6;
}

// ==================== ENUMS ====================

enum Weather {
  WEATHER_UNSPECIFIED = 0;
  WEATHER_CLEAR = 1;
  WEATHER_RAIN = 2;
  WEATHER_THUNDER = 3;
}

enum NavigationState {
  NAVIGATION_STATE_UNSPECIFIED = 0;
  NAVIGATION_STATE_IDLE = 1;
  NAVIGATION_STATE_PATHING = 2;
  NAVIGATION_STATE_STUCK = 3;
  NAVIGATION_STATE_ARRIVED = 4;
  NAVIGATION_STATE_BUILDING = 5;
}

enum DamageSourceType {
  DAMAGE_SOURCE_TYPE_UNSPECIFIED = 0;
  DAMAGE_SOURCE_TYPE_MOB = 1;
  DAMAGE_SOURCE_TYPE_PLAYER = 2;
  DAMAGE_SOURCE_TYPE_ARROW = 3;
  DAMAGE_SOURCE_TYPE_FALL = 4;
  DAMAGE_SOURCE_TYPE_EXPLOSION = 5;
  DAMAGE_SOURCE_TYPE_LAVA = 6;
  DAMAGE_SOURCE_TYPE_DROWN = 7;
}

enum ChatChannel {
  CHAT_CHANNEL_UNSPECIFIED = 0;
  CHAT_CHANNEL_LOCAL = 1;
  CHAT_CHANNEL_CLAN_BROADCAST = 2;
}

// ==================== ADMINISTRATIVE RPCS ====================

message SpawnAgentRequest {
  string agent_id = 1;
  string display_name = 2;
  string clan_id = 3;
  Vec3 spawn_coords = 4;
  bytes skin_png_bytes = 5;      // Max 64 KB payload (standard 64x64 or 128x128 RGBA PNG texture)
  string skin_texture_value = 6;
  string skin_signature = 7;
  bool is_child = 8;
}

message SpawnAgentResponse {
  bool success = 1;
  int32 minecraft_entity_id = 2;
  string offline_uuid = 3;
  string error_message = 4;
}

message DespawnAgentRequest {
  string agent_id = 1;
  string reason = 2;
}

message DespawnAgentResponse {
  bool success = 1;
}

message ExportRecipeRequest {}

message RecipeIngredientSlot {
  repeated string accepted_item_ids = 1;
  int32 count = 2;
}

message RecipeNode {
  string recipe_id = 1;
  string recipe_type = 2;       // e.g., "minecraft:crafting_shaped", "farmersdelight:cooking"
  string workstation_block = 3; // e.g., "minecraft:crafting_table", "farmersdelight:cooking_pot"
  repeated ItemStackProto ingredients = 4;
  ItemStackProto result = 5;
  repeated RecipeIngredientSlot ingredient_slots = 6;
  bool requires_3x3 = 7;
}

message ExportRecipeResponse {
  repeated RecipeNode recipes = 1;
}

// ==================== TELEMETRY (Server -> Agent @ 5 Hz) ====================

message TelemetryFrame {
  int64 world_tick = 1;
  int64 time_of_day = 2;        // 0 - 24000 tick cycle
  Weather weather = 3;
  string biome_id = 4;
  AgentStatus status = 5;
  repeated VisibleEntity visible_entities = 6;
  repeated VisibleBlock interesting_blocks = 7;
  repeated ChatEvent incoming_chats = 8;
  DamageEvent last_damage_taken = 9;
  TradeRequest pending_trade = 10;
  FarmlandSurveyEvent farmland_survey = 11;
  LandmarkContext current_landmark = 12;
  DeathEvent death_event = 13;  // Terminal event triggering permadeath teardown
  int64 last_processed_sequence_id = 14;
  repeated ReflexNotice reflex_notices = 15; // ADR-015 afferent telemetry for Layer 1A in-engine reflexes
  IntentReceipt receipt = 16;
  HorizonSurveyReport horizon_survey = 17; // ADR-032 360-degree peripheral horizon survey report
}

message AgentStatus {
  string agent_id = 1;
  int32 entity_id = 2;
  Vec3 position = 3;
  float yaw = 4;
  float pitch = 5;
  float health = 6;
  float max_health = 7;
  int32 food_level = 8;         // 0 - 20
  float saturation = 9;
  bool is_sleeping = 10;
  bool is_in_water = 11;
  bool is_on_fire = 12;
  NavigationState navigation_state = 13;
  repeated ItemStackProto inventory = 14;
  repeated int32 leashed_entity_ids = 15;
  float stamina = 16;           // 0 - 100 sprint stamina
  bool navigation_enclosed = 17; // true when local BFS finds no exit (pit / sealed pocket)
  bool submerged = 18;          // eyes in water (sustained drowning hazard; is_in_water is feet/body)
  int32 air_supply = 19;        // remaining air ticks (Entity#getAirSupply)
  int32 max_air_supply = 20;    // Entity#getMaxAirSupply (300 default)
  FishingState fishing = 21;    // cq-390.4: bobber/bite telemetry; unset when no line is cast
}

// FishingState reports the agent's fishing hook (Player#fishing): the bobber in the water and
// whether a fish is biting (reel now). Absent from AgentStatus when no line is cast.
message FishingState {
  bool cast = 1;                // a hook entity exists
  bool in_water = 2;            // the bobber floats in open water
  bool bite = 3;                // a fish is on the line: reel in now
  Vec3 bobber_pos = 4;
}

message VisibleEntity {
  int32 entity_id = 1;
  string uuid = 2;
  string entity_type = 3;       // e.g., "minecraft:player", "minecraft:zombie", "minecraft:mule"
  string display_name = 4;
  Vec3 position = 5;
  float distance = 6;
  float health = 7;
  bool is_hostile = 8;
  bool is_tamed = 9;
  string held_item_id = 10;
  int32 fuse_ticks = 11;        // > 0 if Creeper is hissing
  bool is_baby = 12;            // AgeableMob#isBaby (never shear or farm babies)
  bool is_sheared = 13;         // Sheep#isSheared (wool regrows; shearable only when !is_sheared && !is_baby)
}

message VisibleBlock {
  BlockPosProto pos = 1;
  string block_id = 2;
  string block_state_string = 3; // e.g., "age=7,honey_level=5" or "minecraft:wheat[age=7]"
}

message ChatEvent {
  string sender_uuid = 1;
  string sender_name = 2;
  string message = 3;
  float distance = 4;
}

message DamageEvent {
  DamageSourceType source_type = 1;
  int32 attacker_entity_id = 2;
  string attacker_uuid = 3;
  string attacker_name = 4;
  float damage_amount = 5;
}

message TradeRequest {
  int32 player_entity_id = 1;
  string player_uuid = 2;
  string player_name = 3;
  repeated ItemStackProto player_offered_items = 4;
  string spoken_proposal = 5;
}

message FarmlandSurveyEvent {
  BoundingBoxProto bounds = 1;
  string primary_crop_id = 2;
  int32 mature_crop_count = 3;
  int32 total_farmland_blocks = 4;
  string inferred_owner_uuid = 5;
}

message LandmarkContext {
  string landmark_id = 1;
  string display_name = 2;
  string category = 3;
}

message DeathEvent {
  string agent_id = 1;
  int64 world_tick = 2;
  Vec3 death_location = 3;
  string damage_source = 4;
  int32 killer_entity_id = 5;
  string killer_uuid = 6;
  string killer_display_name = 7;
  repeated ItemStackProto dropped_loot = 8;
}

message ReflexNotice {
  enum ReflexType {
    REFLEX_TYPE_UNSPECIFIED = 0;
    REFLEX_TYPE_SHIELD_DEFENSE = 1;
    REFLEX_TYPE_AUTO_EAT = 2;
    REFLEX_TYPE_ITEM_VACUUM = 3;
    REFLEX_TYPE_DODGE = 4;
    REFLEX_TYPE_FLEE = 5;
    REFLEX_TYPE_COMBAT = 6;
  }
  ReflexType reflex_type = 1;
  int64 tick = 2;
  string details = 3;
  uint64 preempted_frame_id = 4;  // ADR-036 s5: Go Frame.ID preempted by the reflex (0 = unknown)
  bool popped = 5;                // false = pushed, true = popped (Go may resume)
}

message IntentReceipt {
  enum ReceiptStatus {
    RECEIPT_STATUS_UNSPECIFIED = 0;
    RECEIPT_STATUS_QUEUED = 1;
    RECEIPT_STATUS_EXECUTING = 2;
    RECEIPT_STATUS_COMPLETED = 3;
    RECEIPT_STATUS_PREEMPTED_BY_REFLEX = 4;
    RECEIPT_STATUS_FAILED = 5;
    RECEIPT_STATUS_ABORTED = 6;
    RECEIPT_STATUS_TIMEOUT = 7;
  }
  int64 batch_id = 1;
  int32 active_index = 2;
  ReceiptStatus status = 3;
  string failure_reason = 4;
  int32 motor_stack_depth = 5;  // diagnostics only (ADR-036 s5)
  uint64 frame_id = 6;          // echoed from IntentBatch.frame_id (0 = legacy mod)
  MotorFacts facts = 7;
}

// MotorFacts: Java reports facts, Go decides (ADR-036 s5).
message MotorFacts {
  bool stuck = 1;
  bool enclosed = 2;
  float blocked_bearing_deg = 3;  // ADR-032 yaw convention
  int32 stuck_ticks = 4;
  double progress = 5;            // action-specific (mine progress, remaining distance)
  bool blocked_by_entity = 6;     // ADR-037: obstruction is an alive entity (ADR-033 congestion), not terrain; false = terrain/legacy
}

// HorizonSector summarizes a single azimuth slice of a 360-degree peripheral horizon survey (ADR-032).
// Bearing convention matches Minecraft's native yaw in [0, 360):
//   0°   = South (+Z): dx = -sin(rad(bearing_deg)) = 0,  dz = cos(rad(bearing_deg)) = +1
//   90°  = West  (-X): dx = -1,                         dz = 0
//   180° = North (-Z): dx = 0,                          dz = -1
//   270° = East  (+X): dx = +1,                         dz = 0
message HorizonSector {
  int32 sector_index = 1;     // 0 .. num_sectors-1
  float bearing_deg = 2;      // [0, 360) in Minecraft yaw convention: dx = -sin(rad), dz = cos(rad)
  float hit_distance = 3;     // distance in blocks along bearing to defining hit or max_range
  string feature_type = 4;    // FOREST_CANOPY, WATER, STONE_OUTCROP, STRUCTURE, RIDGE_OBSTRUCTION, OPEN_PLAINS
  string hit_block_id = 5;    // e.g. "minecraft:oak_leaves", "minecraft:water", "minecraft:stone", "minecraft:air"
  double hit_x = 6;
  double hit_y = 7;
  double hit_z = 8;
  float elevation_delta = 9;  // hit_y - origin_y
  bool occluded = 10;         // true if sightline blocked closely (< 14m) by solid obstruction
  bool open_horizon = 11;     // true if sightline stayed open to >= 0.75 * max_range or missed into open sky/plains
}

message HorizonSurveyReport {
  double origin_x = 1;
  double origin_y = 2;
  double origin_z = 3;
  int64 completed_tick = 4;
  float max_range = 5;
  repeated HorizonSector sectors = 6;
}

// ==================== INTENTS (Agent -> Server) ====================

message IntentBatch {
  string agent_id = 1;
  int64 batch_id = 2;
  bool flush_periphery = 3;
  repeated AgentIntent intents = 4;
  int64 timeout_ticks = 5;
  uint64 frame_id = 6;  // Go Frame.ID that emitted the batch (ADR-036 s5; 0 = legacy)
}

message AgentIntent {
  string agent_id = 1;
  int64 sequence_id = 2;
  oneof action {
    NavigateIntent navigate = 3;
    AttackIntent attack = 4;
    InteractBlockIntent interact_block = 5;
    UseItemIntent use_item = 6;
    CraftItemIntent craft_item = 7;
    SendChatIntent chat = 8;
    RespondTradeIntent trade_response = 9;
    CaravanIntent caravan = 10;
    BuildBlockIntent build_block = 11;
    CreateWrittenBookIntent create_book = 12;
    PlaceSignpostIntent place_signpost = 13;
    TransferContainerIntent transfer_container = 14;
    SurveyHorizonIntent survey_horizon = 15;
  }
}

message NavigateIntent {
  Vec3 target = 1;
  float speed_multiplier = 2;
  bool sprint = 3;
  bool allow_break_blocks = 4;
  bool allow_place_scaffolding = 5;
  int32 arrival_tolerance = 6;
}

message AttackIntent {
  int32 target_entity_id = 1;
  bool raise_shield = 2;
  bool keep_distance_kite = 3;
  bool flee_immediately = 4;
}

message InteractBlockIntent {
  enum InteractionType {
    INTERACTION_TYPE_UNSPECIFIED = 0;
    HARVEST_BREAK = 1;
    PLACE_BLOCK = 2;
    SLEEP_IN_BED = 3;
    WAKE_UP = 4;
    USE_WORKSTATION = 5;
    RING_BELL = 6;
    SHEAR_OR_BOTTLE_BEEHIVE = 7;
    PAVE_ROAD_PATH = 8;
  }
  BlockPosProto pos = 1;
  InteractionType interaction_type = 2;
  string block_or_item_id = 3;
}

message UseItemIntent {
  enum Mode {
    MODE_UNSPECIFIED = 0;   // legacy: eat/drink/equip flags decide
    SHEAR_ENTITY = 1;       // cq-390.3: shear target_entity_id with shears from the inventory
    CAST_FISHING_ROD = 2;   // cq-390.4: equip a fishing rod and cast (no-op if a line is out)
    REEL_FISHING_ROD = 3;   // cq-390.4: retrieve the line (catch on bite)
  }
  int32 inventory_slot = 1;
  bool is_eating_or_drinking = 2;
  bool equip_armor_or_offhand = 3;
  Mode mode = 4;
  int32 target_entity_id = 5;
  Vec3 aim_at = 6;              // CAST_FISHING_ROD: world point to face before casting (the bobber flies where the agent looks)
}

message CraftItemIntent {
  string recipe_id = 1;
  BlockPosProto workstation_pos = 2;
  int32 batch_count = 3;
}

message SendChatIntent {
  string message = 1;
  ChatChannel target_channel = 2;
}

message RespondTradeIntent {
  int32 player_entity_id = 1;
  bool accept_deal = 2;
  repeated ItemStackProto agent_counter_offer = 3;
  repeated ItemStackProto demanded_from_player = 4;
  string spoken_response = 5;
}

message CaravanIntent {
  enum CaravanAction {
    CARAVAN_ACTION_UNSPECIFIED = 0;
    LEASH_BEAST = 1;
    UNLEASH_BEAST = 2;
    HITCH_TO_FENCE = 3;
    LOAD_BEAST_CHEST = 4;
    UNLOAD_BEAST_CHEST = 5;
  }
  CaravanAction action = 1;
  int32 beast_entity_id = 2;
  BlockPosProto fence_pos = 3;
  repeated ItemStackProto cargo_items = 4;
}

message BuildBlockIntent {
  BlockPosProto target_voxel = 1;
  string block_state_string = 2; // e.g., "minecraft:stone_brick_stairs[facing=north,half=bottom]"
  bool is_temporary_scaffold = 3;
}

message CreateWrittenBookIntent {
  string title = 1;             // Max 32 chars
  string author = 2;
  repeated string pages = 3;    // Max 100 pages, <= 250 chars & <= 14 lines per page
  BlockPosProto target_lectern_or_shelf = 4;
  int32 bookshelf_slot = 5;     // 0 - 5 for chiseled bookshelf
}

message PlaceSignpostIntent {
  BlockPosProto pos = 1;
  bool is_hanging_sign = 2;
  string line1 = 3;             // Max 15 chars
  string line2 = 4;
  string line3 = 5;
  string line4 = 6;
}

message TransferContainerIntent {
  BlockPosProto container_pos = 1;
  bool deposit_into_container = 2; // true = deposit, false = withdraw
  repeated ItemStackProto items = 3;
}

message SurveyHorizonIntent {
  int32 num_sectors = 1;       // default 36 (10° increments)
  float max_range = 2;         // default 64.0 blocks (up to 96.0)
  int32 ticks_per_sector = 3;  // default 2 ticks (~3.6s for 36 bearings)
}
