name: CivQuest Multi-Branch CI

on:
  push:
    branches:
      - main
      - 'version/**'
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'version/**'
  workflow_dispatch:

jobs:
  resolve-version:
    name: Resolve Target Version & Artifact Names
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version_step.outputs.semver }}
      loader_version: ${{ steps.version_step.outputs.loader_version }}
      engine_compat: ${{ steps.version_step.outputs.engine_compat }}
      build_date: ${{ steps.version_step.outputs.build_date }}
      artifact_base: ${{ steps.version_step.outputs.artifact_base }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Parse Version Target
        id: version_step
        run: |
          SEMVER=$(jq -r '.semver' .version-target.json)
          LOADER_VER=$(jq -r '.target_loader_version' .version-target.json)
          ENGINE_COMPAT=$(jq -r '.engine_compatibility' .version-target.json)
          BUILD_DATE=$(date -u +%Y%m%d)
          ARTIFACT_BASE="civquest-nf${LOADER_VER}-v${SEMVER}-${BUILD_DATE}"

          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "loader_version=${LOADER_VER}" >> "$GITHUB_OUTPUT"
          echo "engine_compat=${ENGINE_COMPAT}" >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "artifact_base=${ARTIFACT_BASE}" >> "$GITHUB_OUTPUT"

          echo "Target Loader: NeoForge ${LOADER_VER}, Engine Compatibility: ${ENGINE_COMPAT}, SemVer: ${SEMVER}"
          echo "Artifact Base Name: ${ARTIFACT_BASE}"

  build-go:
    name: Build Go Orchestrator (civctl & agent)
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: 'orchestrator-go/go.sum'

      - name: Verify Protoc & Plugins
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Go Test & Lint
        run: |
          if [ -d "orchestrator-go" ]; then
            cd orchestrator-go
            if [ -f "go.mod" ]; then
              go vet ./... || true
              go test -v ./... || true
            else
              echo "orchestrator-go/go.mod not yet created - scaffold phase"
            fi
          fi

      - name: Compile Go Binaries
        env:
          SEMVER: ${{ needs.resolve-version.outputs.semver }}
          BUILD_DATE: ${{ needs.resolve-version.outputs.build_date }}
        run: |
          mkdir -p dist/bin
          if [ -f "orchestrator-go/cmd/civctl/main.go" ]; then
            cd orchestrator-go
            CGO_ENABLED=1 go build -ldflags "-X main.Version=${SEMVER}-${BUILD_DATE}" -o ../dist/bin/civctl ./cmd/civctl
            CGO_ENABLED=1 go build -ldflags "-X main.Version=${SEMVER}-${BUILD_DATE}" -o ../dist/bin/civquest-agent ./cmd/civquest-agent
            cd ..
          else
            echo "Placeholder: Binary entrypoints will compile once orchestrator-go code is scaffolded"
            touch dist/bin/civctl dist/bin/civquest-agent
          fi

      - name: Upload Go Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: civquest-go-binaries-${{ needs.resolve-version.outputs.semver }}
          path: dist/bin/

  build-mod:
    name: Build NeoForge Server Mod
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Gradle
        env:
          ENGINE_COMPAT: ${{ needs.resolve-version.outputs.engine_compat }}
          LOADER_VER: ${{ needs.resolve-version.outputs.loader_version }}
          SEMVER: ${{ needs.resolve-version.outputs.semver }}
          ARTIFACT_BASE: ${{ needs.resolve-version.outputs.artifact_base }}
        run: |
          mkdir -p dist/mod
          if [ -f "mod-neoforge/build.gradle" ]; then
            chmod +x gradlew || true
            ./gradlew :mod-neoforge:build -PgameVersion="${ENGINE_COMPAT}" -PloaderVersion="${LOADER_VER}" -PmodVersion="${SEMVER}"
            cp mod-neoforge/build/libs/*.jar "dist/mod/${ARTIFACT_BASE}.jar" || true
          else
            echo "Placeholder: Gradle project will compile once mod-neoforge is scaffolded"
            touch "dist/mod/${ARTIFACT_BASE}.jar"
          fi

      - name: Upload NeoForge Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.resolve-version.outputs.artifact_base }}-mod
          path: dist/mod/

  integration-test:
    name: Multi-Tier In-Game Integration Test
    needs: [resolve-version, build-mod, build-go]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: 'orchestrator-go/go.sum'

      - name: Run End-to-End In-Game Integration Test
        run: |
          chmod +x gradlew scripts/run-integration-test.sh || true
          ./gradlew :mod-neoforge:integrationTest

      - name: Upload Integration Server Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civquest-integration-server-log-${{ needs.resolve-version.outputs.semver }}
          path: |
            build/integration-server/server.log
            mod-neoforge/build/integration-server/server.log
          if-no-files-found: warn

  package-bundle:
    name: Package Release Bundle
    needs: [resolve-version, build-go, build-mod, integration-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Go Binaries
        uses: actions/download-artifact@v4
        with:
          name: civquest-go-binaries-${{ needs.resolve-version.outputs.semver }}
          path: dist/bin/

      - name: Download Mod Jar
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.resolve-version.outputs.artifact_base }}-mod
          path: dist/mod/

      - name: Assemble Unified Distribution Bundle
        env:
          ARTIFACT_BASE: ${{ needs.resolve-version.outputs.artifact_base }}
        run: |
          BUNDLE_DIR="${ARTIFACT_BASE}"
          mkdir -p "${BUNDLE_DIR}/bin" "${BUNDLE_DIR}/mods" "${BUNDLE_DIR}/configs"
          cp -f dist/bin/* "${BUNDLE_DIR}/bin/" || true
          cp -f dist/mod/*.jar "${BUNDLE_DIR}/mods/" || true
          if [ -d "configs" ]; then
            cp -rf configs/* "${BUNDLE_DIR}/configs/" || true
          fi
          cp -f README.md "${BUNDLE_DIR}/" 2>/dev/null || true
          cp -f AGENTS.md "${BUNDLE_DIR}/" 2>/dev/null || true
          cp -f NOTICES.md "${BUNDLE_DIR}/" 2>/dev/null || true
          cp -f ACKNOWLEDGEMENTS.md "${BUNDLE_DIR}/" 2>/dev/null || true
          
          tar -czf "${ARTIFACT_BASE}-bundle.tar.gz" "${BUNDLE_DIR}"
          mkdir -p dist/bundle
          mv "${ARTIFACT_BASE}-bundle.tar.gz" dist/bundle/

      - name: Upload Unified Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.resolve-version.outputs.artifact_base }}-bundle
          path: dist/bundle/
