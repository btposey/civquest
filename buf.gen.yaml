# CivQuest Protobuf Code Generation Configuration
# Go bindings are generated via Buf CLI. Java gRPC bindings require
# the protoc-gen-grpc-java C++ plugin, which is invoked alongside protoc
# in scripts/gen-proto.sh to populate mod-neoforge/src/generated/main/java.
version: v2
plugins:
  - local: protoc-gen-go
    out: orchestrator-go
    opt:
      - module=github.com/btposey/civquest/orchestrator-go
  - local: protoc-gen-go-grpc
    out: orchestrator-go
    opt:
      - module=github.com/btposey/civquest/orchestrator-go
